name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: OpenCV version (git tag or branch)
        default: ""
  schedule:
    # monthly, to catch distro package changes
    - cron: "17 4 1 * *"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck build_opencv.sh

  build:
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build, test and install
        env:
          CLEANUP: "no"
        run: ./build_opencv.sh "${{ inputs.version }}" test

      - name: Check the install
        run: |
          python3 -c "import cv2; print(cv2.__version__); print(cv2.getBuildInformation())"
          pkg-config --modversion opencv4

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: /tmp/build_opencv/opencv/build/*.log
          if-no-files-found: ignore
